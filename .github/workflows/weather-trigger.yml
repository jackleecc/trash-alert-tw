name: Trigger weather check

on:
  schedule:
    # 每天每 30 分鐘執行一次，全天候監控降雨
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: weather-trigger
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call check-weather endpoint
        env:
          # 若沒有獨立的 WEATHER_URL secret，可以組合已有的 CHECK_TRUCKS_URL
          # 假設 CHECK_TRUCKS_URL = https://your-domain.vercel.app/api/check-trucks
          # 我們這裡可以將 /api/check-trucks 替換為 /api/check-weather
          # 但更安全的是新增一個 CHECK_WEATHER_URL 秘密。為相容性，這裡示範替換邏輯。
          BASE_URL: ${{ secrets.CHECK_TRUCKS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "缺少 CHECK_TRUCKS_URL 或 CRON_SECRET secret。" >&2
            exit 1
          fi
          
          # 將 check-trucks 替換為 check-weather
          ENDPOINT="${BASE_URL/check-trucks/check-weather}"
          
          echo "Triggering $ENDPOINT ..."
          http_code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "$ENDPOINT")
            
          echo "HTTP ${http_code}"
          cat /tmp/resp.json || true
          
          # 2xx 視為成功
          case "$http_code" in
            2*) exit 0 ;;
            *) exit 1 ;;
          esac
